name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

# A new push to a pull request cancels its previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, unit tests and builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build app
        run: npm run build

      - name: Build documentation
        run: npm run docs:build

  integration:
    name: Integration tests (minijob server)
    runs-on: ubuntu-latest

    # A throwaway in-memory minijob server, so the destructive tests can run too
    services:
      minijob:
        image: ghcr.io/nbigot/minijob:1.1.3
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/livez || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      MINIJOB_URL: http://127.0.0.1:8080
      MINIJOB_DESTRUCTIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  docker:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
